name: Continuous Deployment

on:
  push:
    branches:
      - main
      - dev
      - release/*
      - ci/*
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - dev
      - release/*
      - ci/*

env:
  APP_NAME: dmirror
  WX_VERSION: 3.2.11
  WX_HEADERS_SHA256: 886de90e6f428f268541e395b18261126476288fedfb87c147ea8ab426059d77
  WX_DEV_SHA256: 6fe8681737f5b6b1b06eeb6a33984c09d96b0ad570f9b0569b471000484c3105
  WX_RUNTIME_SHA256: 342ef58e099ee85b4d95ae4168cab452142fd00c0b5b116f555ee2cf0d8ac02d

jobs:
  test:
    runs-on: ubuntu-latest

    container:
      image: debian:stable-slim

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y \
            build-essential \
            cmake \
            libwxgtk3.2-dev

      - name: Build
        run: make

      - name: Run tests
        run: make test

  build:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15-intel
          - macos-15
          - windows-2025

    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'windows-2025' }}

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libwxgtk3.2-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install wxwidgets

      - name: Install official wxWidgets binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $wxRoot = Join-Path "${{ runner.temp }}" "wxWidgets"
          $runtimeRoot = Join-Path "${{ runner.temp }}" "wxWidgets-runtime"
          $downloadRoot = Join-Path "${{ runner.temp }}" "wxWidgets-downloads"
          New-Item -ItemType Directory -Force $wxRoot, $runtimeRoot, $downloadRoot | Out-Null

          function Install-WxArchive {
            param(
              [string] $Name,
              [string] $Sha256,
              [string] $Destination
            )

            $archive = Join-Path $downloadRoot $Name
            $url = "https://github.com/wxWidgets/wxWidgets/releases/download/v$env:WX_VERSION/$Name"
            curl.exe -L --fail --retry 3 --output $archive $url
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to download $Name"
            }

            $actualSha256 = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualSha256 -ne $Sha256) {
              throw "Checksum verification failed for $Name"
            }

            7z.exe x $archive -y "-o$Destination" | Out-Null
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to extract $Name"
            }
          }

          Install-WxArchive `
            "wxWidgets-$env:WX_VERSION-headers.7z" `
            $env:WX_HEADERS_SHA256 `
            $wxRoot
          Install-WxArchive `
            "wxMSW-${env:WX_VERSION}_vc14x_x64_Dev.7z" `
            $env:WX_DEV_SHA256 `
            $wxRoot
          Install-WxArchive `
            "wxMSW-${env:WX_VERSION}_vc14x_x64_ReleaseDLL.7z" `
            $env:WX_RUNTIME_SHA256 `
            $runtimeRoot

          $wxRoot = $wxRoot.Replace('\', '/')
          $wxRuntime = (Join-Path $runtimeRoot "lib/vc14x_x64_dll").Replace('\', '/')
          $wxLicense = (Join-Path $runtimeRoot "licence.txt").Replace('\', '/')
          "CMAKE_ARGS=-DBUILD_SHARED_LIBS=ON -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL -DwxWidgets_ROOT_DIR=$wxRoot -DwxWidgets_LIB_DIR=$wxRoot/lib/vc14x_x64_dll -DwxWidgets_CONFIGURATION=mswu" >> $env:GITHUB_ENV
          "WX_RUNTIME_DIR=$wxRuntime" >> $env:GITHUB_ENV
          "WX_LICENSE_FILE=$wxLicense" >> $env:GITHUB_ENV

      - name: Build
        run: make

      - name: Package unix binaries
        if: runner.os != 'Windows'
        run: |
          cd build/bin
          tar -czf ${{ env.APP_NAME }}_${{ runner.os }}_${{runner.arch}}.tar.gz DMirror

      - name: Package Windows binary and runtime DLLs
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $output = "build/bin/Release"
          $packageRoot = "build/package"
          $packageDirectory = "$packageRoot/DMirror"
          Copy-Item "$env:WX_RUNTIME_DIR/*.dll" $output
          Copy-Item $env:WX_LICENSE_FILE "$output/wxWidgets-LICENSE.txt"

          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $visualStudio = & $vswhere -latest -property installationPath
          $redist = Get-ChildItem "$visualStudio/VC/Redist/MSVC" -Directory |
            Where-Object { $_.Name -match '^\d+(\.\d+)+$' } |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1
          $crt = Get-ChildItem "$($redist.FullName)/x64" -Directory -Filter "Microsoft.VC*.CRT" |
            Sort-Object Name -Descending |
            Select-Object -First 1
          Copy-Item "$($crt.FullName)/*.dll" $output

          New-Item -ItemType Directory -Force $packageDirectory | Out-Null
          Copy-Item "$output/*" $packageDirectory -Recurse

          Compress-Archive `
            -Path $packageDirectory `
            -DestinationPath "build/${{ env.APP_NAME }}_${{ runner.os }}.zip"

      - name: Upload unix binaries
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}_${{ runner.os }}_${{runner.arch}}
          path: build/bin/${{ env.APP_NAME }}_${{ runner.os }}_${{runner.arch}}.tar.gz
          if-no-files-found: error

      - name: Upload Windows binary
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}_${{ runner.os }}
          path: build/${{ env.APP_NAME }}_${{ runner.os }}.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false

    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ env.APP_NAME }}_*
          merge-multiple: true
          path: artifacts

      - name: Remove assets from an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' |
              while IFS= read -r asset; do
                gh release delete-asset "$GITHUB_REF_NAME" "$asset" --yes
              done
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          files: artifacts/*
