name: Continuous Deployment

on:
  push:
    branches:
      - main
      - dev
      - release/*
      - ci/*
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - dev
      - release/*
      - ci/*

env:
  APP_NAME: dmirror
  WX_VERSION: 3.2.11
  WX_HEADERS_SHA256: 886de90e6f428f268541e395b18261126476288fedfb87c147ea8ab426059d77
  WX_DEV_SHA256: 6fe8681737f5b6b1b06eeb6a33984c09d96b0ad570f9b0569b471000484c3105
  WX_RUNTIME_SHA256: 342ef58e099ee85b4d95ae4168cab452142fd00c0b5b116f555ee2cf0d8ac02d

jobs:
  test:
    runs-on: ubuntu-latest

    container:
      image: debian:stable-slim

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y \
            build-essential \
            cmake \
            libwxgtk3.2-dev

      - name: Build
        run: make

      - name: Run tests
        run: make test

  build:
    needs: test
    env:
      DMIRROR_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15-intel
          - macos-15
          - windows-2025

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            curl \
            dpkg-dev \
            file \
            libgirepository1.0-dev \
            librsvg2-dev \
            libwxgtk3.2-dev \
            pkg-config

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install wxwidgets
          echo "HOMEBREW_PREFIX=$(brew --prefix)" >> "$GITHUB_ENV"

      - name: Install official wxWidgets binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis -y

          $wxRoot = Join-Path "${{ runner.temp }}" "wxWidgets"
          $runtimeRoot = Join-Path "${{ runner.temp }}" "wxWidgets-runtime"
          $downloadRoot = Join-Path "${{ runner.temp }}" "wxWidgets-downloads"
          New-Item -ItemType Directory -Force $wxRoot, $runtimeRoot, $downloadRoot | Out-Null

          function Install-WxArchive {
            param(
              [string] $Name,
              [string] $Sha256,
              [string] $Destination
            )

            $archive = Join-Path $downloadRoot $Name
            $url = "https://github.com/wxWidgets/wxWidgets/releases/download/v$env:WX_VERSION/$Name"
            curl.exe -L --fail --retry 3 --output $archive $url
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to download $Name"
            }

            $actualSha256 = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualSha256 -ne $Sha256) {
              throw "Checksum verification failed for $Name"
            }

            7z.exe x $archive -y "-o$Destination" | Out-Null
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to extract $Name"
            }
          }

          Install-WxArchive `
            "wxWidgets-$env:WX_VERSION-headers.7z" `
            $env:WX_HEADERS_SHA256 `
            $wxRoot
          Install-WxArchive `
            "wxMSW-${env:WX_VERSION}_vc14x_x64_Dev.7z" `
            $env:WX_DEV_SHA256 `
            $wxRoot
          Install-WxArchive `
            "wxMSW-${env:WX_VERSION}_vc14x_x64_ReleaseDLL.7z" `
            $env:WX_RUNTIME_SHA256 `
            $runtimeRoot

          $wxRoot = $wxRoot.Replace('\', '/')
          $wxRuntime = (Join-Path $runtimeRoot "lib/vc14x_x64_dll").Replace('\', '/')
          $wxLicense = (Join-Path $runtimeRoot "licence.txt").Replace('\', '/')
          "CMAKE_ARGS=-DBUILD_SHARED_LIBS=ON -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL -DwxWidgets_ROOT_DIR=$wxRoot -DwxWidgets_LIB_DIR=$wxRoot/lib/vc14x_x64_dll -DwxWidgets_CONFIGURATION=mswu -DWX_RUNTIME_DIR=$wxRuntime -DWX_LICENSE_FILE=$wxLicense" >> $env:GITHUB_ENV

      - name: Build package
        if: runner.os != 'macOS'
        run: make build-package

      - name: Build AppImage
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          DEPLOY_GTK_VERSION: 3
        run: |
          set -euo pipefail

          case "$(uname -m)" in
            x86_64)
              arch=x86_64
              checksum=c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d
              ;;
            aarch64)
              arch=aarch64
              checksum=620095110d693282b8ebeb244a95b5e911cf8f65f76c88b4b47d16ae6346fcff
              ;;
            *)
              echo "Unsupported AppImage architecture: $(uname -m)"
              exit 1
              ;;
          esac

          tools="$PWD/build/appimage-tools"
          linuxdeploy="$tools/linuxdeploy-$arch.AppImage"
          gtk_plugin="$tools/linuxdeploy-plugin-gtk.sh"
          mkdir -p "$tools"

          curl -L --fail --retry 3 -o "$linuxdeploy" \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-$arch.AppImage"
          echo "$checksum  $linuxdeploy" | sha256sum --check

          curl -L --fail --retry 3 -o "$gtk_plugin" \
            "https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/7a3fbc31a9e5075073ff8790f26effbac5f84453/linuxdeploy-plugin-gtk.sh"
          echo "b0f4cbc684a0103a9651f0955b635eaea0096b3a66c0f5a2c2aa337960375171  $gtk_plugin" | sha256sum --check
          chmod +x "$linuxdeploy" "$gtk_plugin"

          version=$(<build/package-version.txt)
          LDAI_OUTPUT="$PWD/build/packages/DMirror-${version}-linux-${arch}.AppImage" \
            "$linuxdeploy" \
              --appdir build/AppDir \
              --executable build/bin/DMirror \
              --desktop-file packaging/linux/dmirror.desktop \
              --icon-file packaging/linux/dmirror.png \
              --plugin gtk \
              --output appimage

      - name: Upload package
        if: runner.os != 'macOS' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}_${{ matrix.os }}
          path: |
            build/packages/*.deb
            build/packages/*.dmg
            build/packages/*.exe
            build/packages/*.AppImage
          if-no-files-found: error

      - name: Build macOS app bundle
        if: runner.os == 'macOS'
        run: |
          make
          cmake --install build --prefix build/macos-package --config Release
          cp build/package-version.txt build/macos-package/
          tar -czf build/DMirror-${{ runner.arch }}.tar.gz \
            -C build/macos-package \
            DMirror.app README.md package-version.txt

      - name: Upload macOS app bundle
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: macos-app-${{ runner.arch }}
          path: build/DMirror-${{ runner.arch }}.tar.gz
          if-no-files-found: error

  package-macos:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15

    steps:
      - name: Download native macOS apps
        uses: actions/download-artifact@v8
        with:
          pattern: macos-app-*
          merge-multiple: true
          path: build/native-macos

      - name: Create universal app
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/arm64 build/x86_64 build/universal-image build/packages
          tar -xzf build/native-macos/DMirror-ARM64.tar.gz -C build/arm64
          tar -xzf build/native-macos/DMirror-X64.tar.gz -C build/x86_64

          arm_app=build/arm64/DMirror.app
          x64_app=build/x86_64/DMirror.app
          universal_app=build/universal-image/DMirror.app
          cp -R "$arm_app" "$universal_app"
          cp build/arm64/README.md build/universal-image/
          ln -s /Applications build/universal-image/Applications

          while IFS= read -r -d '' arm_file; do
            if ! arm_archs=$(lipo -archs "$arm_file" 2>/dev/null); then
              continue
            fi

            relative=${arm_file#"$arm_app"/}
            x64_file="$x64_app/$relative"
            universal_file="$universal_app/$relative"
            test -f "$x64_file"

            x64_archs=$(lipo -archs "$x64_file")
            case "$arm_archs" in *arm64*) ;; *) exit 1 ;; esac
            case "$x64_archs" in *x86_64*) ;; *) exit 1 ;; esac

            if [[ "$arm_archs" == *x86_64* ]]; then
              continue
            elif [[ "$x64_archs" == *arm64* ]]; then
              cp "$x64_file" "$universal_file"
            else
              lipo -create "$arm_file" "$x64_file" -output "$universal_file.tmp"
              chmod 755 "$universal_file.tmp"
              mv "$universal_file.tmp" "$universal_file"
            fi
          done < <(find "$arm_app" -type f -print0)

          while IFS= read -r -d '' universal_file; do
            if ! archs=$(lipo -archs "$universal_file" 2>/dev/null); then
              continue
            fi
            case "$archs" in *arm64*) ;; *) exit 1 ;; esac
            case "$archs" in *x86_64*) ;; *) exit 1 ;; esac
            if otool -L "$universal_file" | \
              grep -E '(@rpath|/opt/homebrew|/usr/local/(Cellar|opt))'; then
              echo "Unresolved external dependency in $universal_file"
              exit 1
            fi
          done < <(find "$universal_app" -type f -print0)

          codesign --force --deep --sign - "$universal_app"
          codesign --verify --deep --strict "$universal_app"

          version=$(<build/arm64/package-version.txt)
          hdiutil create \
            -volname DMirror \
            -srcfolder build/universal-image \
            -ov \
            -format UDZO \
            "build/packages/DMirror-${version}-macOS-universal.dmg"

      - name: Upload universal macOS package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}_macOS-universal
          path: build/packages/*.dmg
          if-no-files-found: error

  release:
    needs:
      - build
      - package-macos
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false

    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ env.APP_NAME }}_*
          merge-multiple: true
          path: artifacts

      - name: Remove assets from an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' |
              while IFS= read -r asset; do
                gh release delete-asset "$GITHUB_REF_NAME" "$asset" --yes
              done
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          files: artifacts/*
