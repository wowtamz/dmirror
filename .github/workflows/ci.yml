name: Continuous Deployment

on:
  push:
    branches:
      - ci/*

env:
  APP_NAME: dmirror

jobs:
  test:
    runs-on: ubuntu-latest

    container:
      image: debian:stable-slim

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y \
            build-essential \
            cmake \
            libwxgtk3.2-dev

      - name: Build
        run: make

      - name: Run tests
        run: make test

  build:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'windows-latest' }}

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libwxgtk3.2-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install wxwidgets

      - name: Configure vcpkg binary cache (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VCPKG_FEED_URL: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
        run: |
          $nuget = (vcpkg fetch nuget | Select-Object -Last 1).Trim()
          & $nuget sources add `
            -Source $env:VCPKG_FEED_URL `
            -StorePasswordInClearText `
            -Name GitHubPackages `
            -UserName "${{ github.actor }}" `
            -Password "${{ secrets.GITHUB_TOKEN }}" `
            -NonInteractive
          & $nuget setapikey "${{ secrets.GITHUB_TOKEN }}" `
            -Source $env:VCPKG_FEED_URL `
            -NonInteractive

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VCPKG_BINARY_SOURCES: clear;nuget,https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json,readwrite
        run: |
          vcpkg install wxwidgets:x64-windows-static
          echo "CMAKE_ARGS=-DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows-static" >> $env:GITHUB_ENV

      - name: Build
        run: make

      - name: Package unix binaries
        if: runner.os != 'Windows'
        run: |
          cd build/bin
          tar -czf ${{ env.APP_NAME }}_${{ runner.os }}.tar.gz DMirror

      - name: Package Windows binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path build/bin/Release/* -DestinationPath build/${{ env.APP_NAME }}_${{ runner.os }}.zip

      - name: Upload unix binaries
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}_${{ runner.os }}
          path: build/bin/${{ env.APP_NAME }}_${{ runner.os }}.tar.gz
          if-no-files-found: error

      - name: Upload Windows binaries
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}_${{ runner.os }}
          path: build/${{ env.APP_NAME }}_${{ runner.os }}.zip
          if-no-files-found: error