name: Windows Deployment (Official wxWidgets)

on:
  push:
    branches:
      - ci/*
    

env:
  APP_NAME: dmirror
  WX_VERSION: 3.2.11
  WX_HEADERS_SHA256: 886de90e6f428f268541e395b18261126476288fedfb87c147ea8ab426059d77
  WX_DEV_SHA256: 6fe8681737f5b6b1b06eeb6a33984c09d96b0ad570f9b0569b471000484c3105
  WX_RUNTIME_SHA256: 342ef58e099ee85b4d95ae4168cab452142fd00c0b5b116f555ee2cf0d8ac02d

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Install official wxWidgets binaries
        shell: pwsh
        run: |
          $wxRoot = Join-Path "${{ runner.temp }}" "wxWidgets"
          $runtimeRoot = Join-Path "${{ runner.temp }}" "wxWidgets-runtime"
          $downloadRoot = Join-Path "${{ runner.temp }}" "wxWidgets-downloads"
          New-Item -ItemType Directory -Force $wxRoot, $runtimeRoot, $downloadRoot | Out-Null

          function Install-WxArchive {
            param(
              [string] $Name,
              [string] $Sha256,
              [string] $Destination
            )

            $archive = Join-Path $downloadRoot $Name
            $url = "https://github.com/wxWidgets/wxWidgets/releases/download/v$env:WX_VERSION/$Name"
            curl.exe -L --fail --retry 3 --output $archive $url
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to download $Name"
            }

            $actualSha256 = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualSha256 -ne $Sha256) {
              throw "Checksum verification failed for $Name"
            }

            7z.exe x $archive -y "-o$Destination" | Out-Null
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to extract $Name"
            }
          }

          Install-WxArchive `
            "wxWidgets-$env:WX_VERSION-headers.7z" `
            $env:WX_HEADERS_SHA256 `
            $wxRoot
          Install-WxArchive `
            "wxMSW-${env:WX_VERSION}_vc14x_x64_Dev.7z" `
            $env:WX_DEV_SHA256 `
            $wxRoot
          Install-WxArchive `
            "wxMSW-${env:WX_VERSION}_vc14x_x64_ReleaseDLL.7z" `
            $env:WX_RUNTIME_SHA256 `
            $runtimeRoot

          $wxRoot = $wxRoot.Replace('\', '/')
          $wxRuntime = (Join-Path $runtimeRoot "lib/vc14x_x64_dll").Replace('\', '/')
          $wxLicense = (Join-Path $runtimeRoot "licence.txt").Replace('\', '/')
          "CMAKE_ARGS=-DBUILD_SHARED_LIBS=ON -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL -DwxWidgets_ROOT_DIR=$wxRoot -DwxWidgets_LIB_DIR=$wxRoot/lib/vc14x_x64_dll -DwxWidgets_CONFIGURATION=mswu" >> $env:GITHUB_ENV
          "WX_RUNTIME_DIR=$wxRuntime" >> $env:GITHUB_ENV
          "WX_LICENSE_FILE=$wxLicense" >> $env:GITHUB_ENV

      - name: Build
        shell: pwsh
        run: |
          Copy-Item CMakeLists-win.txt CMakeLists.txt
          make

      - name: Package Windows binary and runtime DLLs
        shell: pwsh
        run: |
          $output = "build/bin/Release"
          Copy-Item "$env:WX_RUNTIME_DIR/*.dll" $output
          Copy-Item $env:WX_LICENSE_FILE "$output/wxWidgets-LICENSE.txt"

          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $visualStudio = & $vswhere -latest -property installationPath
          $redist = Get-ChildItem "$visualStudio/VC/Redist/MSVC" -Directory |
            Where-Object { $_.Name -match '^\d+(\.\d+)+$' } |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1
          $crt = Get-ChildItem "$($redist.FullName)/x64" -Directory -Filter "Microsoft.VC*.CRT" |
            Sort-Object Name -Descending |
            Select-Object -First 1
          Copy-Item "$($crt.FullName)/*.dll" $output

          Compress-Archive `
            -Path "$output/*" `
            -DestinationPath "build/${{ env.APP_NAME }}_Windows_no-cache.zip"

      - name: Upload Windows binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}_Windows_no-cache
          path: build/${{ env.APP_NAME }}_Windows_no-cache.zip
          if-no-files-found: error
